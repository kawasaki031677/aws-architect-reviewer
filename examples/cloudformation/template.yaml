AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Sample CloudFormation template that intentionally contains Well-Architected issues for demonstration.
  Running /review should detect these issues.

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues: [production, staging, development]

  DBPassword:
    Type: String
    # SEC-SM-001 CRITICAL: Do not place passwords in Defaults; use a Secrets Manager dynamic reference.
    NoEcho: true

Resources:

  # ─── VPC ──────────────────────────────────────────────────────────────────

  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      # NET-VPC-003 WARNING: EnableDnsSupport and EnableDnsHostnames are not set
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-vpc"
      # NET-VPC-002 WARNING: VPC Flow Logs resource is not defined

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      # NET-SUB-005 WARNING: only one AZ is defined

  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]

  # ─── Security Group ─────────────────────────────────────────────────────────

  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Web server security group
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0  # SEC-SG-001 CRITICAL: SSH is exposed to the entire internet
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  # ─── EC2 ──────────────────────────────────────────────────────────────────

  AppServer:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      ImageId: ami-0d52744d6551d851e
      SubnetId: !Ref PublicSubnet        # NET-SUB-001 CRITICAL: application server is in a public subnet
      SecurityGroupIds:
        - !Ref WebSecurityGroup
      # REL-SPOF-001 CRITICAL: single EC2 instance without an ASG
      UserData:
        Fn::Base64: |
          #!/bin/bash
          # SEC-SM-001 CRITICAL: credentials must not be hardcoded in UserData; retrieve them from Secrets Manager
      Tags:
        - Key: Name
          Value: app-server
        # COST-TAG-001 WARNING: Environment, Team, and Project tags are missing

  # ─── RDS ──────────────────────────────────────────────────────────────────

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Database subnet group
      SubnetIds:
        - !Ref PrivateSubnet
        # REL-MAZ-001: only one subnet (single AZ)

  Database:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: prod-db
      DBInstanceClass: db.t3.micro
      Engine: mysql
      EngineVersion: "8.0"
      MasterUsername: admin
      MasterUserPassword: !Ref DBPassword
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !Ref WebSecurityGroup
      MultiAZ: false              # REL-MAZ-001 CRITICAL: Multi-AZ is disabled
      StorageEncrypted: false     # SEC-KMS-001 CRITICAL: encryption is disabled
      BackupRetentionPeriod: 0    # REL-BKP-001 CRITICAL: backups are disabled
    DeletionPolicy: Delete

  # ─── S3 ───────────────────────────────────────────────────────────────────

  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-data"
      VersioningConfiguration:
        Status: Enabled
      # SEC-S3-001/002/003/004 CRITICAL: PublicAccessBlockConfiguration is not set
      # COST-S3-001 WARNING: LifecycleConfiguration is not set

  # ─── IAM ──────────────────────────────────────────────────────────────────

  AppRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: app-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: app-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: "*"          # SEC-IAM-001 CRITICAL: wildcard action
                Resource: "*"        # SEC-IAM-002 CRITICAL: wildcard resource

Outputs:
  VpcId:
    Value: !Ref VPC
    Description: VPC ID
  AppServerPublicIp:
    Value: !GetAtt AppServer.PublicIp
    Description: Application server public IP
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
    Description: RDS endpoint
